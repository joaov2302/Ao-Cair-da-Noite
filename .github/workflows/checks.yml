name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env: {POSTGRES_USER: acdn_test, POSTGRES_HOST: 127.0.0.1, POSTGRES_PORT: '55432'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r backend/requirements.txt
      - uses: ./.github/actions/postgres-test
      - run: python scripts/test_env.py api
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-postgresql, path: test-results/}
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    env: {POSTGRES_USER: acdn_test, POSTGRES_HOST: 127.0.0.1, POSTGRES_PORT: '55432'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.txt
      - uses: ./.github/actions/postgres-test
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: e2e-postgresql, path: test-results/}
