services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: acdn
      POSTGRES_USER: acdn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acdn']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
